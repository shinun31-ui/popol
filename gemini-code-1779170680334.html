<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#2C2C2A"/>
<link rel="manifest" href="/manifest.json"/>
<title>POPOL</title>
<style>
:root{--bg:#fff;--bg2:#f5f4f0;--text:#1a1a18;--text2:#5f5e5a;--text3:#9c9a92;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--charcoal:#2C2C2A;--warm:#F1EFE8;--blue:#185FA5;--bluebg:#E6F1FB;--red:#A32D2D;--r:10px;--rlg:14px;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--bg2:#242422;--text:#f0ede6;--text2:#a8a69e;--text3:#6e6c65;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);}}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;}
/* SPLASH */
#splash{position:fixed;inset:0;background:#2C2C2A;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}
.splash-logo{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:56px;height:56px;}
.splash-logo .sq{border-radius:5px;background:#F1EFE8;transition:opacity .35s ease;}
.splash-word{font-size:26px;font-weight:600;letter-spacing:.3em;color:#F1EFE8;opacity:0;transition:opacity .7s ease;}
.splash-word.show{opacity:1;}
.splash-sub{font-size:11px;letter-spacing:.14em;color:rgba(241,239,232,.4);opacity:0;transition:opacity .7s ease .2s;}
.splash-sub.show{opacity:1;}
/* LOGIN */
#loginScreen{position:fixed;inset:0;background:#2C2C2A;z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem;opacity:0;}
.login-box{width:100%;max-width:360px;}
.login-logo{text-align:center;margin-bottom:2rem;display:flex;flex-direction:column;align-items:center;}
.login-logo-icon{width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.login-wordmark{font-size:26px;font-weight:600;letter-spacing:.22em;color:#F1EFE8;}
.login-sub-text{font-size:11px;color:rgba(241,239,232,.35);margin-top:4px;letter-spacing:.12em;}
.login-card{background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.1);border-radius:14px;padding:20px;margin-bottom:12px;}
.login-label{font-size:12px;color:rgba(241,239,232,.45);margin-bottom:8px;}
.login-input{width:100%;background:rgba(255,255,255,.08);border:0.5px solid rgba(255,255,255,.15);border-radius:8px;padding:11px 13px;color:#F1EFE8;font-size:14px;margin-bottom:8px;outline:none;font-family:inherit;}
.login-input:focus{border-color:rgba(255,255,255,.4);}
.login-input::placeholder{color:rgba(241,239,232,.3);}
.login-btn-row{display:flex;gap:8px;margin-top:4px;}
.login-btn{flex:1;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
.login-btn-primary{background:#F1EFE8;color:#2C2C2A;}
.login-btn-secondary{background:transparent;color:#F1EFE8;border:0.5px solid rgba(255,255,255,.2);}
.login-divider{display:flex;align-items:center;gap:10px;margin:12px 0;}
.login-divider-line{flex:1;height:0.5px;background:rgba(255,255
