<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>POPOL Dev</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:#1a1a18;color:#F1EFE8;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;}
.wrap{max-width:440px;margin:0 auto;padding:52px 24px 60px;}

.logo{display:flex;align-items:center;gap:12px;margin-bottom:52px;}
.logo-icon{width:40px;height:40px;background:#2C2C2A;border-radius:9px;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px;}
.logo-icon div{border-radius:2px;background:#F1EFE8;}
.logo-icon div:nth-child(2){opacity:.55;}
.logo-icon div:nth-child(3){opacity:.55;}
.logo-icon div:nth-child(4){opacity:.25;}
.logo-word{font-size:22px;font-weight:800;font-style:italic;letter-spacing:.04em;}
.logo-sub{font-size:11px;color:rgba(241,239,232,.3);margin-top:2px;}

.section-label{font-size:10px;font-weight:600;letter-spacing:.1em;color:rgba(241,239,232,.3);text-transform:uppercase;margin-bottom:12px;}

/* 한번에 열기 */
.open-all{
  width:100%;background:#185FA5;color:#fff;
  border:none;border-radius:16px;padding:20px;
  font-size:16px;font-weight:700;
  cursor:pointer;text-align:center;
  margin-bottom:8px;
  transition:opacity .15s,transform .1s;
  display:block;
}
.open-all:active{transform:scale(0.98);opacity:.9;}
.tip{font-size:11px;color:rgba(241,239,232,.28);text-align:center;margin-bottom:32px;line-height:1.6;}

.divider{height:0.5px;background:rgba(241,239,232,.08);margin:28px 0;}

/* 개별 카드 */
.cards{display:flex;flex-direction:column;gap:10px;}
.card{
  display:flex;align-items:center;gap:16px;
  background:#2C2C2A;border:0.5px solid rgba(241,239,232,.08);
  border-radius:14px;padding:16px 18px;
  cursor:pointer;text-decoration:none;color:inherit;
  transition:background .15s,transform .1s;
}
.card:active{transform:scale(0.98);}
.card:hover{background:#333330;}
.card-icon{font-size:24px;flex-shrink:0;width:36px;text-align:center;}
.card-info{flex:1;}
.card-title{font-size:14px;font-weight:600;margin-bottom:2px;}
.card-url{font-size:11px;color:rgba(241,239,232,.35);}
.card-arrow{color:rgba(241,239,232,.2);font-size:16px;}

.divider2{height:0.5px;background:rgba(241,239,232,.08);margin:28px 0;}

/* POPOL 앱 */
.app-btn{
  display:flex;align-items:center;gap:16px;
  background:#2C2C2A;border:0.5px solid rgba(241,239,232,.15);
  border-radius:14px;padding:16px 18px;
  cursor:pointer;color:inherit;text-decoration:none;
  transition:background .15s,transform .1s;
}
.app-btn:active{transform:scale(0.98);}
.app-btn:hover{background:#333330;}
.app-badge{background:#185FA5;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:8px;vertical-align:middle;}

.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
  background:#F1EFE8;color:#1a1a18;
  padding:10px 22px;border-radius:30px;
  font-size:13px;font-weight:600;
  opacity:0;transition:opacity .3s;
  pointer-events:none;white-space:nowrap;
  z-index:999;
}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="logo-icon">
      <div></div><div></div><div></div><div></div>
    </div>
    <div>
      <div class="logo-word">POPOL</div>
      <div class="logo-sub">개발 런처</div>
    </div>
  </div>

  <button class="open-all" onclick="openAll()">⚡ 개발 탭 한번에 열기</button>
  <p class="tip">GitHub · Vercel · Supabase 동시에 열려요<br/>팝업 차단 시 개별로 눌러주세요</p>

  <div class="section-label">개별 열기</div>
  <div class="cards">
    <a class="card" href="https://github.com/shinun31-ui/popol" target="_blank">
      <span class="card-icon">🐙</span>
      <div class="card-info">
        <div class="card-title">GitHub</div>
        <div class="card-url">index.html 파일 올리는 곳</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
    <a class="card" href="https://vercel.com/shinun31-uis-projects/popol" target="_blank">
      <span class="card-icon">▲</span>
      <div class="card-info">
        <div class="card-title">Vercel</div>
        <div class="card-url">배포 상태 확인</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
    <a class="card" href="https://supabase.com/dashboard/project/jriljajqtseoedeqlxag" target="_blank">
      <span class="card-icon">🗄️</span>
      <div class="card-info">
        <div class="card-title">Supabase</div>
        <div class="card-url">DB · 스토리지 · 정지 시 복구</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
  </div>

  <div class="divider2"></div>

  <div class="section-label" style="margin-bottom:10px;">앱 바로가기</div>
  <a class="app-btn" href="https://popol-six.vercel.app" target="_blank">
    <span class="card-icon">📱</span>
    <div class="card-info">
      <div class="card-title">POPOL 앱 <span class="app-badge">LIVE</span></div>
      <div class="card-url">popol-six.vercel.app</div>
    </div>
    <span class="card-arrow">›</span>
  </a>

</div>

<div class="toast" id="toast">3개 탭 열렸어요!</div>

<script>
function openAll(){
  var urls=[
    'https://github.com/shinun31-ui/popol',
    'https://vercel.com/shinun31-uis-projects/popol',
    'https://supabase.com/dashboard/project/jriljajqtseoedeqlxag'
  ];
  var opened=0;
  urls.forEach(function(url){
    var w=window.open(url,'_blank');
    if(w)opened++;
  });
  if(opened>0){
    var t=document.getElementById('toast');
    t.textContent=opened+'개 탭 열렸어요!';
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},2200);
  } else {
    alert('팝업이 차단됐어요!\n아래 카드를 하나씩 눌러주세요.');
  }
}
</script>
</body>
</html>
