:root{--bg:#fff;--bg2:#f5f4f0;--text:#1a1a18;--text2:#5f5e5a;--text3:#9c9a92;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--charcoal:#2C2C2A;--warm:#F1EFE8;--blue:#185FA5;--bluebg:#E6F1FB;--red:#A32D2D;--r:10px;--rlg:14px;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--bg2:#242422;--text:#f0ede6;--text2:#a8a69e;--text3:#6e6c65;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);}}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;}
/* SPLASH */
#splash{position:fixed;inset:0;background:#2C2C2A;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}
.splash-logo{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:56px;height:56px;}
.splash-logo .sq{border-radius:5px;background:#F1EFE8;transition:opacity .35s ease;}
.splash-word{font-size:26px;font-weight:600;letter-spacing:.3em;color:#F1EFE8;opacity:0;transition:opacity .7s ease;}
.splash-word.show{opacity:1;}
.splash-sub{font-size:11px;letter-spacing:.14em;color:rgba(241,239,232,.4);opacity:0;transition:opacity .7s ease .2s;}
.splash-sub.show{opacity:1;}
